<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>לוח בקרה · מכירות</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --surface-0: #f7f8fa;      /* page */
      --surface-1: #ffffff;      /* cards, chart surface */
      --border: #e8eaef;
      --grid: #eef0f3;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --accent: #2a78d6;         /* series-1, validated vs. white */
      --accent-strong: #1c5cab;
      --accent-soft: #eaf2fc;
      --good: #0f7a3d;
      --good-soft: #e7f6ed;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 4px 16px rgba(15, 23, 42, .04);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Heebo", system-ui, "Segoe UI", Arial, sans-serif;
      background: var(--surface-0);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }
    .app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }

    /* ---------- Sidebar (sits on the right in RTL) ---------- */
    .sidebar {
      background: var(--surface-1);
      border-inline-end: 1px solid var(--border);
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .brand { display: flex; align-items: center; gap: .65rem; padding: 0 .5rem; font-weight: 700; font-size: 1.1rem; }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 9px;
      background: linear-gradient(135deg, #3987e5, #1c5cab);
      display: grid; place-items: center; color: #fff;
    }
    .brand-mark svg { width: 18px; height: 18px; }
    .nav { list-style: none; margin: 0; padding: 0; display: grid; gap: .25rem; }
    .nav a {
      display: flex; align-items: center; gap: .75rem;
      padding: .65rem .75rem;
      border-radius: 10px;
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 500;
      font-size: .95rem;
      transition: background .15s, color .15s;
    }
    .nav a:hover { background: var(--surface-0); color: var(--text-primary); }
    .nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
    .nav svg { width: 20px; height: 20px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav a:focus-visible, button:focus-visible, .chart-svg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .sidebar-footer { margin-top: auto; display: flex; align-items: center; gap: .65rem; padding: .75rem; border-top: 1px solid var(--border); }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--accent-soft); color: var(--accent-strong);
      display: grid; place-items: center; font-weight: 700; font-size: .9rem;
    }
    .user-name { font-weight: 600; font-size: .9rem; }
    .user-role { color: var(--text-muted); font-size: .8rem; }

    /* ---------- Main ---------- */
    main { padding: 2rem 2.5rem 3rem; max-width: 1280px; width: 100%; min-width: 0; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.75rem; }
    .page-head h1 { margin: 0; font-size: 1.6rem; font-weight: 700; }
    .page-head p { margin: .25rem 0 0; color: var(--text-muted); font-size: .95rem; }
    .period {
      display: inline-flex; align-items: center; gap: .5rem;
      background: var(--surface-1); border: 1px solid var(--border);
      border-radius: 10px; padding: .5rem .85rem;
      color: var(--text-secondary); font-size: .9rem; font-weight: 500;
    }
    .period svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; }

    .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }

    /* KPI row */
    .kpis { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem; }
    .kpi { padding: 1.4rem 1.5rem; display: flex; flex-direction: column; gap: .5rem; }
    .kpi-label { display: flex; align-items: center; gap: .5rem; color: var(--text-secondary); font-size: .9rem; font-weight: 500; }
    .kpi-icon { width: 30px; height: 30px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-strong); display: grid; place-items: center; }
    .kpi-icon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .kpi-value { text-align: right; font-size: 2rem; font-weight: 600; letter-spacing: -.01em; line-height: 1.15; }
    .kpi.hero .kpi-value { font-size: 3.25rem; font-weight: 700; } /* the one hero figure */
    .kpi-foot { display: flex; align-items: center; gap: .5rem; color: var(--text-muted); font-size: .85rem; }
    .delta {
      display: inline-flex; align-items: center; gap: .2rem;
      padding: .1rem .5rem; border-radius: 999px;
      background: var(--good-soft); color: var(--good);
      font-weight: 600; font-size: .8rem;
    }
    .delta svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.5; }
    .num { direction: ltr; unicode-bidi: isolate; }

    /* Chart card */
    .chart-card { padding: 1.4rem 1.5rem 1rem; }
    .chart-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: .75rem; }
    .chart-head h2 { margin: 0; font-size: 1.1rem; font-weight: 600; }
    .chart-head p { margin: .2rem 0 0; color: var(--text-muted); font-size: .88rem; }
    .toggle { display: inline-flex; background: var(--surface-0); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
    .toggle button {
      border: 0; background: transparent; font: inherit; font-size: .85rem; font-weight: 500;
      color: var(--text-secondary); padding: .35rem .85rem; border-radius: 7px; cursor: pointer;
    }
    .toggle button[aria-pressed="true"] { background: var(--surface-1); color: var(--text-primary); box-shadow: 0 1px 2px rgba(15,23,42,.08); }

    .chart-wrap { position: relative; height: 340px; }
    .chart-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; direction: ltr; }
    .chart-svg text { font-family: inherit; font-size: 12px; fill: var(--text-muted); font-variant-numeric: tabular-nums; }
    .tooltip {
      position: absolute; top: 0; pointer-events: none;
      background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 8px 24px rgba(15,23,42,.10);
      padding: .55rem .75rem; min-width: 140px;
      opacity: 0; transition: opacity .12s;
      white-space: nowrap;
    }
    .tooltip.show { opacity: 1; }
    .tt-month { color: var(--text-muted); font-size: .8rem; margin-bottom: .2rem; }
    .tt-row { display: flex; align-items: center; gap: .5rem; }
    .tt-key { width: 12px; height: 2px; background: var(--accent); border-radius: 1px; }
    .tt-value { font-weight: 700; font-size: 1rem; color: var(--text-primary); }
    .tt-label { color: var(--text-secondary); font-size: .8rem; }

    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { padding: .6rem .5rem; text-align: start; border-bottom: 1px solid var(--grid); }
    th { color: var(--text-muted); font-weight: 500; font-size: .82rem; }
    td.money { font-variant-numeric: tabular-nums; }
    .table-view { max-height: 340px; overflow: auto; }
    [hidden] { display: none !important; }

    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* Responsive */
    @media (max-width: 1080px) {
      .kpis { grid-template-columns: 1fr 1fr; }
      .kpi.hero { grid-column: 1 / -1; }
    }
    @media (max-width: 820px) {
      .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
      .sidebar { position: static; height: auto; flex-direction: row; align-items: center; gap: 1rem; padding: .75rem 1rem; border-inline-end: 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
      .nav { display: flex; }
      .nav a span { display: none; }
      .sidebar-footer { display: none; }
      main { padding: 1.5rem 1rem 2rem; }
      .kpis { grid-template-columns: 1fr; }
      .kpi.hero .kpi-value { font-size: 2.75rem; }
      .chart-wrap { height: 280px; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="תפריט צד">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l5-5 4 4 7-8"/></svg>
      </span>
      <span>מכירות פלוס</span>
    </div>
    <nav aria-label="ניווט ראשי">
      <ul class="nav">
        <li><a href="#" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span>לוח בקרה</span></a></li>
        <li><a href="#">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.4 3.5 5.2"/></svg>
          <span>לקוחות</span></a></li>
        <li><a href="#">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2h12l1 4H5z"/><path d="M5 6h14v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M9 10a3 3 0 0 0 6 0"/></svg>
          <span>הזמנות</span></a></li>
        <li><a href="#">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span>הגדרות</span></a></li>
      </ul>
    </nav>
    <div class="sidebar-footer">
      <div class="avatar" aria-hidden="true">אג</div>
      <div>
        <div class="user-name">אבישי גרינברג</div>
        <div class="user-role">בעל העסק</div>
      </div>
    </div>
  </aside>

  <main>
    <div class="page-head">
      <div>
        <h1>לוח בקרה</h1>
        <p>סקירת המכירות של העסק שלך</p>
      </div>
      <div class="period">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span id="period-label"></span>
      </div>
    </div>

    <section class="kpis" aria-label="מדדים מרכזיים">
      <article class="card kpi hero">
        <div class="kpi-label">
          <span class="kpi-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span>
          סך ההכנסות החודש
        </div>
        <div class="kpi-value num" id="kpi-revenue"></div>
        <div class="kpi-foot" id="kpi-revenue-foot"></div>
      </article>
      <article class="card kpi">
        <div class="kpi-label">
          <span class="kpi-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="10" cy="8" r="4"/><path d="M3 21c.9-4 3.7-6 7-6s6.1 2 7 6M19 8v6M16 11h6"/></svg></span>
          לקוחות חדשים
        </div>
        <div class="kpi-value num" id="kpi-customers"></div>
        <div class="kpi-foot">החודש</div>
      </article>
      <article class="card kpi">
        <div class="kpi-label">
          <span class="kpi-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg></span>
          ערך הזמנה ממוצע
        </div>
        <div class="kpi-value num" id="kpi-aov"></div>
        <div class="kpi-foot">החודש</div>
      </article>
    </section>

    <section class="card chart-card" aria-labelledby="chart-title">
      <div class="chart-head">
        <div>
          <h2 id="chart-title">מגמת הכנסות</h2>
          <p>12 החודשים האחרונים</p>
        </div>
        <div class="toggle" role="group" aria-label="אופן התצוגה">
          <button type="button" id="btn-chart" aria-pressed="true">גרף</button>
          <button type="button" id="btn-table" aria-pressed="false">טבלה</button>
        </div>
      </div>

      <div class="chart-wrap" id="chart-view">
        <svg class="chart-svg" id="chart" direction="ltr" tabindex="0" role="img"
             aria-label="גרף קו של ההכנסות ב־12 החודשים האחרונים. השתמשו בחיצים כדי לעבור בין החודשים."></svg>
        <div class="tooltip" id="tooltip" aria-hidden="true">
          <div class="tt-month" id="tt-month"></div>
          <div class="tt-row"><span class="tt-key"></span><span class="tt-value num" id="tt-value"></span></div>
          <div class="tt-label">הכנסות</div>
        </div>
        <div class="sr-only" id="chart-live" aria-live="polite"></div>
      </div>

      <div class="table-view" id="table-view" hidden>
        <table>
          <caption class="sr-only">הכנסות לפי חודש</caption>
          <thead><tr><th scope="col">חודש</th><th scope="col">הכנסות</th><th scope="col">שינוי מהחודש הקודם</th></tr></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script>
  // ---------- Sample data ----------
  const LOCALE = 'he-IL';
  const KPI = { revenue: 45230, customers: 127, aov: 356 };
  const revenueSeries = [31200, 29800, 33400, 35100, 34200, 37800, 39500, 38200, 41000, 42600, 41350, 45230];

  const today = new Date();
  const months = revenueSeries.map((value, i) => {
    const d = new Date(today.getFullYear(), today.getMonth() - (revenueSeries.length - 1 - i), 1);
    return { date: d, value };
  });

  const money = new Intl.NumberFormat(LOCALE, { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
  const count = new Intl.NumberFormat(LOCALE);
  const compact = new Intl.NumberFormat(LOCALE, { style: 'currency', currency: 'USD', notation: 'compact', maximumFractionDigits: 0 });
  const pct = new Intl.NumberFormat(LOCALE, { style: 'percent', maximumFractionDigits: 1, signDisplay: 'always' });
  const monthShort = d => d.toLocaleDateString(LOCALE, { month: 'short' });
  const monthLong = d => d.toLocaleDateString(LOCALE, { month: 'long', year: 'numeric' });

  // ---------- Header + KPIs ----------
  document.getElementById('period-label').textContent = monthLong(today);
  document.getElementById('kpi-revenue').textContent = money.format(KPI.revenue);
  document.getElementById('kpi-customers').textContent = count.format(KPI.customers);
  document.getElementById('kpi-aov').textContent = money.format(KPI.aov);

  const prev = revenueSeries[revenueSeries.length - 2];
  const change = (KPI.revenue - prev) / prev;
  const foot = document.getElementById('kpi-revenue-foot');
  const delta = document.createElement('span');
  delta.className = 'delta num';
  delta.innerHTML = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 10V2M2.5 5.5L6 2l3.5 3.5"/></svg>';
  delta.append(pct.format(change));
  foot.append(delta, document.createTextNode('לעומת ' + monthLong(months[months.length - 2].date)));

  // ---------- Table view ----------
  const tbody = document.getElementById('table-body');
  [...months].reverse().forEach((m, i, arr) => {
    const tr = document.createElement('tr');
    const before = arr[i + 1];
    [monthLong(m.date), money.format(m.value), before ? pct.format((m.value - before.value) / before.value) : '—']
      .forEach((text, c) => {
        const td = document.createElement('td');
        td.textContent = text;
        if (c > 0) { td.className = 'money'; td.dir = 'ltr'; td.style.textAlign = 'right'; }
        tr.append(td);
      });
    tbody.append(tr);
  });

  const btnChart = document.getElementById('btn-chart');
  const btnTable = document.getElementById('btn-table');
  function showView(table) {
    btnChart.setAttribute('aria-pressed', String(!table));
    btnTable.setAttribute('aria-pressed', String(table));
    document.getElementById('chart-view').hidden = table;
    document.getElementById('table-view').hidden = !table;
    if (!table) drawChart();
  }
  btnChart.addEventListener('click', () => showView(false));
  btnTable.addEventListener('click', () => showView(true));

  // ---------- Line chart (hand-built SVG) ----------
  // Time runs left → right, the standard reading for time series even on RTL pages.
  const svg = document.getElementById('chart');
  const tooltip = document.getElementById('tooltip');
  const live = document.getElementById('chart-live');
  const NS = 'http://www.w3.org/2000/svg';
  const el = (name, attrs) => {
    const node = document.createElementNS(NS, name);
    for (const k in attrs) node.setAttribute(k, attrs[k]);
    return node;
  };

  let geom = null;
  let activeIndex = null;

  function drawChart() {
    const { width, height } = svg.getBoundingClientRect();
    if (!width) return;
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    svg.replaceChildren();

    const pad = { top: 28, right: 72, bottom: 32, left: 48 };
    const w = width - pad.left - pad.right;
    const h = height - pad.top - pad.bottom;
    const yMax = 50000, yStep = 10000;
    const x = i => pad.left + (i / (months.length - 1)) * w;
    const y = v => pad.top + h - (v / yMax) * h;

    // Gridlines + Y ticks
    const grid = el('g', {});
    for (let v = 0; v <= yMax; v += yStep) {
      grid.append(el('line', { x1: pad.left, x2: pad.left + w, y1: y(v), y2: y(v), stroke: 'var(--grid)', 'stroke-width': 1 }));
      const t = el('text', { x: pad.left - 10, y: y(v) + 4, 'text-anchor': 'end' });
      t.textContent = v === 0 ? '0' : compact.format(v);
      grid.append(t);
    }
    svg.append(grid);

    // X labels
    const showEvery = w < 520 ? 2 : 1;
    months.forEach((m, i) => {
      if ((months.length - 1 - i) % showEvery) return;
      const t = el('text', { x: x(i), y: pad.top + h + 22, 'text-anchor': 'middle' });
      t.textContent = monthShort(m.date);
      svg.append(t);
    });

    // Area wash + line
    const pts = months.map((m, i) => [x(i), y(m.value)]);
    const linePath = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
    const defs = el('defs', {});
    const grad = el('linearGradient', { id: 'area-grad', x1: 0, y1: 0, x2: 0, y2: 1 });
    grad.append(el('stop', { offset: '0%', 'stop-color': 'var(--accent)', 'stop-opacity': .14 }));
    grad.append(el('stop', { offset: '100%', 'stop-color': 'var(--accent)', 'stop-opacity': 0 }));
    defs.append(grad);
    svg.append(defs);
    svg.append(el('path', { d: `${linePath}L${pts.at(-1)[0]},${y(0)}L${pts[0][0]},${y(0)}Z`, fill: 'url(#area-grad)' }));
    svg.append(el('path', { d: linePath, fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));

    // Crosshair + hover dot (hidden until hover)
    const cross = el('line', { y1: pad.top, y2: pad.top + h, stroke: '#cbd5e1', 'stroke-width': 1, visibility: 'hidden' });
    const hoverDot = el('circle', { r: 5, fill: 'var(--accent)', stroke: 'var(--surface-1)', 'stroke-width': 2, visibility: 'hidden' });
    svg.append(cross);

    // End dot + direct label (current month)
    const [ex, ey] = pts.at(-1);
    svg.append(el('circle', { cx: ex, cy: ey, r: 5, fill: 'var(--accent)', stroke: 'var(--surface-1)', 'stroke-width': 2 }));
    const endLabel = el('text', { x: ex + 10, y: ey + 4, 'text-anchor': 'start', style: 'fill: var(--text-primary); font-weight: 600; font-size: 13px' });
    endLabel.textContent = compact.format(months.at(-1).value);
    svg.append(endLabel);
    svg.append(hoverDot);

    geom = { pad, w, h, x, y, cross, hoverDot, width };
    if (activeIndex !== null) setActive(activeIndex, false);
  }

  function setActive(i, announce) {
    if (!geom) return;
    activeIndex = i;
    const { x, y, cross, hoverDot, pad, width } = geom;
    const m = months[i];
    const px = x(i), py = y(m.value);
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('visibility', 'visible');
    hoverDot.setAttribute('cx', px); hoverDot.setAttribute('cy', py); hoverDot.setAttribute('visibility', 'visible');

    document.getElementById('tt-month').textContent = monthLong(m.date);
    document.getElementById('tt-value').textContent = money.format(m.value);
    tooltip.classList.add('show');
    const tw = tooltip.offsetWidth;
    let left = px + 14;
    if (left + tw > width) left = px - tw - 14;
    tooltip.style.left = left + 'px';
    tooltip.style.top = Math.max(0, py - 70) + 'px';
    if (announce) live.textContent = `${monthLong(m.date)}: ${money.format(m.value)}`;
  }

  function clearActive() {
    activeIndex = null;
    tooltip.classList.remove('show');
    if (geom) {
      geom.cross.setAttribute('visibility', 'hidden');
      geom.hoverDot.setAttribute('visibility', 'hidden');
    }
  }

  svg.addEventListener('pointermove', e => {
    if (!geom) return;
    const rect = svg.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const i = Math.round(((px - geom.pad.left) / geom.w) * (months.length - 1));
    setActive(Math.max(0, Math.min(months.length - 1, i)), false);
  });
  svg.addEventListener('pointerleave', clearActive);
  svg.addEventListener('focus', () => setActive(activeIndex ?? months.length - 1, true));
  svg.addEventListener('blur', clearActive);
  svg.addEventListener('keydown', e => {
    const i = activeIndex ?? months.length - 1;
    const next = { ArrowLeft: i - 1, ArrowRight: i + 1, Home: 0, End: months.length - 1 }[e.key];
    if (next === undefined) return;
    e.preventDefault();
    setActive(Math.max(0, Math.min(months.length - 1, next)), true);
  });

  new ResizeObserver(drawChart).observe(svg);
  drawChart();
</script>
</body>
</html>
