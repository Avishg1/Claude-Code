<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>משימות · התחברות</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand brand--center">
      <span class="brand__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </span>
      <span class="brand__name">משימות</span>
    </div>

    <h1 class="auth-title" id="auth-title">ברוכים השבים</h1>
    <p class="auth-subtitle" id="auth-subtitle">התחברו כדי לראות את המשימות שלכם</p>

    <div class="segmented" role="tablist" aria-label="בחירת פעולה">
      <button type="button" class="segmented__btn is-active" role="tab" aria-selected="true" data-mode="login">התחברות</button>
      <button type="button" class="segmented__btn" role="tab" aria-selected="false" data-mode="signup">הרשמה</button>
    </div>

    <form id="auth-form" class="form" novalidate>
      <div class="field">
        <label for="email">אימייל</label>
        <input id="email" name="email" type="email" dir="ltr" autocomplete="email" placeholder="name@example.com" required>
      </div>

      <div class="field">
        <label for="password">סיסמה</label>
        <input id="password" name="password" type="password" dir="ltr" autocomplete="current-password" placeholder="••••••••" required minlength="8">
        <p class="field__hint" id="password-hint" hidden>לפחות 8 תווים</p>
      </div>

      <div class="field" id="confirm-field" hidden>
        <label for="confirm">אימות סיסמה</label>
        <input id="confirm" name="confirm" type="password" dir="ltr" autocomplete="new-password" placeholder="••••••••">
      </div>

      <p class="form-error" id="form-error" role="alert" hidden></p>

      <button type="submit" class="btn btn--primary btn--block" id="submit-btn">התחברות</button>
    </form>
  </main>

  <script src="/js/auth.js"></script>
</body>
</html>
