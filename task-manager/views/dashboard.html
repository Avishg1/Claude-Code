<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>משימות · לוח בקרה</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="app-page">
  <header class="topbar">
    <div class="brand">
      <span class="brand__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </span>
      <span class="brand__name">משימות</span>
    </div>
    <div class="topbar__user">
      <span class="topbar__email" id="user-email" dir="ltr"></span>
      <button type="button" class="btn btn--ghost" id="logout-btn">התנתקות</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" aria-label="קטגוריות">
      <ul class="nav-list" id="fixed-views">
        <li>
          <button type="button" class="nav-item" data-view="all">
            <span class="nav-item__name">כל המשימות</span>
            <span class="count" id="count-all">0</span>
          </button>
        </li>
        <li>
          <button type="button" class="nav-item" data-view="none">
            <span class="nav-item__name">ללא קטגוריה</span>
            <span class="count" id="count-none">0</span>
          </button>
        </li>
      </ul>

      <h2 class="sidebar__title">קטגוריות</h2>
      <ul class="nav-list" id="category-list"></ul>
      <p class="sidebar__empty" id="category-empty" hidden>עדיין אין קטגוריות</p>

      <form class="category-form" id="category-form">
        <label for="category-name" class="visually-hidden">שם קטגוריה חדשה</label>
        <input id="category-name" type="text" maxlength="50" placeholder="קטגוריה חדשה…" autocomplete="off">
        <button type="submit" class="btn btn--icon" aria-label="הוספת קטגוריה" title="הוספת קטגוריה">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </form>
      <p class="sidebar__note">המספרים מציגים משימות פתוחות</p>
    </aside>

    <main class="main">
      <div class="main__header">
        <div>
          <h1 class="main__title" id="view-title">כל המשימות</h1>
          <p class="main__subtitle" id="view-subtitle"></p>
        </div>
        <button type="button" class="btn btn--primary" id="new-task-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          משימה חדשה
        </button>
      </div>

      <div class="toolbar">
        <div class="segmented segmented--small" role="tablist" aria-label="סינון לפי סטטוס">
          <button type="button" class="segmented__btn is-active" role="tab" aria-selected="true" data-status="all">הכל</button>
          <button type="button" class="segmented__btn" role="tab" aria-selected="false" data-status="open">פתוחות</button>
          <button type="button" class="segmented__btn" role="tab" aria-selected="false" data-status="done">הושלמו</button>
        </div>
        <span class="overdue-pill" id="overdue-pill" hidden></span>
      </div>

      <ul class="task-list" id="task-list" aria-live="polite"></ul>

      <div class="empty-state" id="empty-state" hidden>
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>
        <p class="empty-state__title" id="empty-title">אין משימות להצגה</p>
        <p class="empty-state__text" id="empty-text">לחצו על "משימה חדשה" כדי להתחיל</p>
      </div>
    </main>
  </div>

  <!-- Task create / edit dialog -->
  <dialog class="dialog" id="task-dialog" aria-labelledby="task-dialog-title">
    <form method="dialog" class="form" id="task-form" novalidate>
      <div class="dialog__header">
        <h2 id="task-dialog-title">משימה חדשה</h2>
        <button type="button" class="btn btn--icon btn--ghost" data-close aria-label="סגירה">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="field">
        <label for="task-title">כותרת</label>
        <input id="task-title" type="text" maxlength="200" required placeholder="מה צריך לעשות?">
      </div>

      <div class="field">
        <label for="task-description">תיאור <span class="optional">(רשות)</span></label>
        <textarea id="task-description" rows="3" maxlength="2000" placeholder="פרטים נוספים…"></textarea>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="task-due">תאריך יעד</label>
          <input id="task-due" type="date" required>
        </div>
        <div class="field">
          <label for="task-priority">עדיפות</label>
          <select id="task-priority">
            <option value="low">נמוכה</option>
            <option value="medium" selected>בינונית</option>
            <option value="high">גבוהה</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="task-category">קטגוריה</label>
        <select id="task-category"></select>
      </div>

      <p class="form-error" id="task-error" role="alert" hidden></p>

      <div class="dialog__actions">
        <button type="button" class="btn btn--ghost" data-close>ביטול</button>
        <button type="submit" class="btn btn--primary" id="task-submit">שמירה</button>
      </div>
    </form>
  </dialog>

  <!-- Confirmation dialog -->
  <dialog class="dialog dialog--small" id="confirm-dialog" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title">אישור מחיקה</h2>
      <p class="confirm-text" id="confirm-text"></p>
      <div class="dialog__actions">
        <button type="submit" class="btn btn--ghost" value="cancel">ביטול</button>
        <button type="submit" class="btn btn--danger" value="confirm">מחיקה</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="/js/dashboard.js"></script>
</body>
</html>
