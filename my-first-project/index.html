<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #ffffff;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
    }
    h1 {
      color: blue;
      font-size: 6rem;
      margin: 0;
    }
    .flag {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 132px;
      height: 96px;
      box-shadow: 0 0 0 1px #ddd;
    }
  </style>
</head>
<body>
  <!-- Israel flag (proportions 8:11) -->
  <svg class="flag" viewBox="0 0 220 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flag of Israel">
    <rect width="220" height="160" fill="#ffffff"/>
    <rect y="15" width="220" height="25" fill="#0038b8"/>
    <rect y="120" width="220" height="25" fill="#0038b8"/>
    <g fill="none" stroke="#0038b8" stroke-width="5.5">
      <polygon points="110,47 139.4,98 80.6,98"/>
      <polygon points="110,113 80.6,62 139.4,62"/>
    </g>
  </svg>

  <h1>Hello World</h1>
</body>
</html>
