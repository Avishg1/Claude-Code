<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ניהול תקלות · התחברות</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/a11y.js"></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-brand">
      <img src="/favicon.svg" alt="" width="48" height="48">
      <div>
        <strong>ניהול תקלות</strong>
        <small>ועד הבית</small>
      </div>
    </div>

    <h1 class="auth-title" id="auth-title">ברוכים השבים</h1>
    <p class="auth-subtitle" id="auth-subtitle">התחברו כדי לראות את התקלות בבניין</p>

    <div class="segmented" role="tablist" aria-label="בחירת פעולה">
      <button type="button" class="segmented-btn is-active" role="tab" aria-selected="true" data-mode="login">התחברות</button>
      <button type="button" class="segmented-btn" role="tab" aria-selected="false" data-mode="signup">הרשמה</button>
    </div>

    <form id="auth-form" class="auth-form" novalidate>
      <div class="field" id="name-field" hidden>
        <label for="name">שם מלא</label>
        <input id="name" name="name" type="text" autocomplete="name" maxlength="60" placeholder="השם שיוצג לחברי הוועד">
      </div>

      <div class="field" id="phone-field" hidden>
        <label for="phone">טלפון <small class="muted">(לא חובה – מוצג לחברי הוועד)</small></label>
        <input id="phone" name="phone" type="tel" dir="ltr" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="050-0000000">
      </div>

      <div class="field">
        <label for="email">אימייל</label>
        <input id="email" name="email" type="email" dir="ltr" autocomplete="email" placeholder="name@example.com" required>
      </div>

      <div class="field">
        <label for="password">סיסמה</label>
        <input id="password" name="password" type="password" dir="ltr" autocomplete="current-password" placeholder="••••••••" required minlength="8">
        <p class="field-hint" id="password-hint" hidden>לפחות 8 תווים</p>
      </div>

      <div class="field" id="confirm-field" hidden>
        <label for="confirm">אימות סיסמה</label>
        <input id="confirm" name="confirm" type="password" dir="ltr" autocomplete="new-password" placeholder="••••••••">
      </div>

      <p class="alert alert-danger" id="form-error" role="alert" hidden></p>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">התחברות</button>
    </form>

    <a href="/help" class="btn btn-secondary btn-block auth-help">📖 מדריך למשתמש</a>
  </main>

  <script src="/js/auth.js"></script>
  <p class="copyright">© כל הזכויות שמורות לאבישי גרינברג</p>
</body>
</html>
